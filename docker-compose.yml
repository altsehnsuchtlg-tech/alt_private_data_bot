version: "3.9"

services:
  bot:
    build:
      context: .
      network: host
    command: python -m app.main
    env_file:
      - .env
    depends_on:
      - postgres

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tg_bot
      POSTGRES_USER: tg_user
      POSTGRES_PASSWORD: tg_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
